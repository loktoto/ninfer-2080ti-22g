name: Release Windows SM75

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (example: windows-sm75-v0.1.0)"
        required: true
        type: string
      acceptance_run_id:
        description: "Successful RTX 2080 Ti SM75 hardware-acceptance workflow run ID for this exact commit"
        required: true
        type: string

permissions:
  contents: write
  actions: read
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Validate release inputs
        shell: pwsh
        run: |
          if ("${{ inputs.tag }}" -notmatch "^windows-sm75-v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$") {
            throw "Invalid release tag. Expected windows-sm75-vMAJOR.MINOR.PATCH."
          }
          if ("${{ inputs.acceptance_run_id }}" -notmatch "^[0-9]+$") {
            throw "acceptance_run_id must be a numeric GitHub Actions run ID."
          }

      - name: Checkout exact release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate distribution source contract
        shell: powershell
        run: .\scripts\validate-windows-sm75-distribution-contract.ps1

      - name: Activate MSVC 2022 dependency tools
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64

      - name: Fetch exact hardware-qualified package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          [long]$runId = [long]"${{ inputs.acceptance_run_id }}"
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$runId" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Unable to read hardware acceptance run $runId." }
          if ($run.name -ne "RTX 2080 Ti SM75 hardware acceptance") {
            throw "Run $runId is not the SM75 hardware-acceptance workflow."
          }
          if ($run.event -ne "workflow_dispatch") {
            throw "Hardware acceptance must come from an explicit workflow_dispatch run."
          }
          if ($run.conclusion -ne "success") {
            throw "Hardware acceptance run $runId did not conclude successfully."
          }
          if ($run.head_sha -ne $env:GITHUB_SHA) {
            throw "Hardware acceptance SHA $($run.head_sha) does not match release SHA $env:GITHUB_SHA."
          }

          $artifactName = "ninfer-windows-sm75-qualified-$env:GITHUB_SHA"
          Remove-Item .\qualified -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force .\qualified | Out-Null
          gh run download $runId --name $artifactName --dir .\qualified
          if ($LASTEXITCODE -ne 0) { throw "Failed to download qualified artifact $artifactName." }

          $zips = @(Get-ChildItem .\qualified -Recurse -Filter "ninfer-windows-sm75-*.zip" -File)
          if ($zips.Count -ne 1) { throw "Expected exactly one qualified ZIP; found $($zips.Count)." }
          $zip = $zips[0]

          $evidenceFiles = @(Get-ChildItem .\qualified -Recurse -Filter "windows-sm75-*.json" -File |
            Where-Object { $_.Directory.Name -eq "acceptance" })
          $validEvidence = @()
          foreach ($candidate in $evidenceFiles) {
            try {
              $parsed = Get-Content $candidate.FullName -Raw | ConvertFrom-Json
              if ($parsed.schema_version -eq 2 -and
                  $parsed.artifact_type -eq "ninfer_windows_sm75_hardware_acceptance") {
                $validEvidence += $candidate
              }
            } catch {}
          }
          if ($validEvidence.Count -ne 1) {
            throw "Expected exactly one schema-v2 hardware acceptance JSON; found $($validEvidence.Count)."
          }
          $evidence = $validEvidence[0]

          foreach ($sidecar in @("$($zip.FullName).sha256", "$($zip.FullName).sbom.cdx.json")) {
            if (-not (Test-Path $sidecar -PathType Leaf)) { throw "Qualified artifact sidecar missing: $sidecar" }
          }

          .\scripts\verify-acceptance-evidence.ps1 `
            -EvidencePath $evidence.FullName `
            -ExpectedGitSha $env:GITHUB_SHA `
            -PackagePath $zip.FullName `
            -LockPath .\config\windows-sm75-artifacts.json

          Remove-Item .\dist -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force .\dist | Out-Null
          Copy-Item $zip.FullName .\dist -Force
          Copy-Item "$($zip.FullName).sha256" .\dist -Force
          Copy-Item "$($zip.FullName).sbom.cdx.json" .\dist -Force

          Remove-Item .\release-evidence -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force .\release-evidence | Out-Null
          Copy-Item $evidence.FullName .\release-evidence\HARDWARE-ACCEPTANCE.json -Force

      - name: Verify qualified release package
        shell: pwsh
        run: .\scripts\verify-package-windows-sm75.ps1

      - name: Validate release verification under Windows PowerShell 5.1
        shell: powershell
        run: |
          @(".\scripts",".\install") | ForEach-Object {
            Get-ChildItem $_ -Filter *.ps1 -File
          } | ForEach-Object {
            [void][ScriptBlock]::Create((Get-Content $_.FullName -Raw))
          }
          .\scripts\verify-package-windows-sm75.ps1

      - name: Resolve exact qualified paths
        id: qualified
        shell: pwsh
        run: |
          $zips = @(Get-ChildItem .\dist -Filter "ninfer-windows-sm75-*.zip" -File)
          if ($zips.Count -ne 1) { throw "Expected exactly one release ZIP." }
          $zip = $zips[0]
          $sbom = "$($zip.FullName).sbom.cdx.json"
          if (-not (Test-Path $sbom -PathType Leaf)) { throw "Release SBOM missing: $sbom" }
          "zip=$($zip.FullName)" >> $env:GITHUB_OUTPUT
          "sbom=$sbom" >> $env:GITHUB_OUTPUT

      - name: Attest build provenance for qualified ZIP
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.qualified.outputs.zip }}

      - name: Attest CycloneDX SBOM for qualified ZIP
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: ${{ steps.qualified.outputs.zip }}
          sbom-path: ${{ steps.qualified.outputs.sbom }}

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "${{ inputs.tag }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists." }

          $assets = @(
            Get-ChildItem .\dist -File | Where-Object {
              $_.Name -like "ninfer-windows-sm75-*.zip" -or
              $_.Name -like "ninfer-windows-sm75-*.zip.sha256" -or
              $_.Name -like "ninfer-windows-sm75-*.zip.sbom.cdx.json"
            } | Sort-Object Name | ForEach-Object { $_.FullName }
          )
          $assets += (Resolve-Path .\release-evidence\HARDWARE-ACCEPTANCE.json).Path
          if ($assets.Count -ne 4) {
            throw "Expected qualified ZIP, SHA-256, SBOM and hardware acceptance evidence."
          }

          $releaseArgs = @("release", "create", $tag) + $assets + @(
            "--target", $env:GITHUB_SHA,
            "--title", "NInfer Windows SM75 $tag",
            "--notes", "Native Windows RTX 2080 Ti / Turing SM75 package. The published ZIP is the exact binary qualified by the referenced physical-hardware acceptance run; GitHub build-provenance and CycloneDX SBOM attestations are generated before publication."
          )
          & gh @releaseArgs
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Release publication failed with exit code $LASTEXITCODE."
          }
