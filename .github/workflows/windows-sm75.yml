name: Windows SM75 compile

on:
  push:
    branches: [windows-native-sm75]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Activate MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install CUDA 13.1 toolkit
        uses: ggml-org/llama.cpp/.github/actions/windows-setup-cuda@e904318a2d3e2382e78c98b4353c5dd569c079f6
        with:
          cuda_version: "13.1"
          cuda_arch: "75"

      - name: Install Ninja
        shell: pwsh
        run: choco install ninja --no-progress -y

      - name: Toolchain versions
        shell: pwsh
        run: |
          cl.exe
          nvcc.exe --version
          cmake.exe --version
          ninja.exe --version

      - name: Configure and compile native SM75
        shell: pwsh
        run: .\scripts\build-windows-sm75.ps1 -Clean

      - name: Upload Windows binaries
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ninfer-windows-sm75
          path: build-windows-sm75/apps/**
          if-no-files-found: error
