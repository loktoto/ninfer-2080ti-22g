name: Windows SM75 production build

on:
  push:
    branches: [windows-native-sm75]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-sm75-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Activate MSVC 2022
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install CUDA 13.1 toolkit
        uses: ggml-org/llama.cpp/.github/actions/windows-setup-cuda@e904318a2d3e2382e78c98b4353c5dd569c079f6
        with:
          cuda_version: "13.1"
          cuda_arch: "75"

      - name: Install Ninja
        shell: pwsh
        run: choco install ninja --no-progress -y

      - name: Cache vcpkg build products
        uses: actions/cache@v4
        with:
          path: |
            .deps/vcpkg/downloads
            .deps/vcpkg/installed
            ~/AppData/Local/vcpkg/archives
          key: vcpkg-sm75-${{ runner.os }}-b3ae22aef2b857af6e80d756c13f15db12be4e8a

      - name: Toolchain versions
        shell: pwsh
        run: |
          cl.exe
          nvcc.exe --version
          cmake.exe --version
          ninja.exe --version

      - name: Build and stage native SM75 runtime
        shell: pwsh
        run: .\scripts\build-windows-sm75.ps1 -Clean

      - name: Verify packaged binaries start
        shell: pwsh
        run: .\scripts\verify-windows-sm75.ps1

      - name: Package release artifact
        shell: pwsh
        run: .\scripts\package-windows-sm75.ps1

      - name: Upload production package
        uses: actions/upload-artifact@v4
        with:
          name: ninfer-windows-sm75-${{ github.sha }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
