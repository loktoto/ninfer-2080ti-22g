name: Windows SM75 production build

on:
  push:
    branches: [windows-native-sm75]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-sm75-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Activate MSVC 2022
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64

      - name: Install CUDA 13.1 toolkit
        uses: ggml-org/llama.cpp/.github/actions/windows-setup-cuda@e904318a2d3e2382e78c98b4353c5dd569c079f6
        with:
          cuda_version: "13.1"
          cuda_arch: "75"

      - name: Install pinned CMake and Ninja
        shell: pwsh
        run: |
          choco install cmake --version=3.31.6 --allow-downgrade --no-progress -y --installargs 'ADD_CMAKE_TO_PATH=System'
          choco install ninja --version=1.13.2 --allow-downgrade --no-progress -y
          $env:PATH = [Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [Environment]::GetEnvironmentVariable("Path","User")

      - name: Cache vcpkg build products
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .deps/vcpkg/downloads
            .deps/vcpkg/installed
            ~/AppData/Local/vcpkg/archives
          key: vcpkg-sm75-${{ runner.os }}-b3ae22aef2b857af6e80d756c13f15db12be4e8a

      - name: Verify pinned production toolchain
        shell: pwsh
        run: .\scripts\assert-windows-sm75-toolchain.ps1

      - name: Build and stage native SM75 runtime
        shell: pwsh
        run: .\scripts\build-windows-sm75.ps1 -Clean -BuildJobs 2

      - name: Verify packaged binaries start
        shell: pwsh
        run: .\scripts\verify-windows-sm75.ps1 -RequireDependencyAudit

      - name: Package release artifact
        shell: pwsh
        run: .\scripts\package-windows-sm75.ps1

      - name: Verify release package integrity
        shell: pwsh
        run: .\scripts\verify-package-windows-sm75.ps1

      - name: Validate Windows PowerShell 5.1 package path
        shell: powershell
        run: |
          @(".\scripts",".\install") | ForEach-Object {
            Get-ChildItem $_ -Filter *.ps1 -File
          } | ForEach-Object {
            [void][ScriptBlock]::Create((Get-Content $_.FullName -Raw))
          }
          .\scripts\verify-windows-sm75.ps1 -RequireDependencyAudit
          .\scripts\package-windows-sm75.ps1
          .\scripts\verify-package-windows-sm75.ps1

      - name: Upload production package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ninfer-windows-sm75-${{ github.sha }}
          path: |
            dist/*.zip
            dist/*.sha256
            dist/*.zip.sbom.cdx.json
          if-no-files-found: error
          retention-days: 14
